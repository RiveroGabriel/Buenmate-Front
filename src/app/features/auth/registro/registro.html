<section class="flex min-h-[calc(100vh-140px)] items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-3xl border border-[#eae3d9] bg-white p-8 shadow-sm">

    <h2 class="text-3xl font-black text-stone-800">Crear cuenta</h2>
    <p class="mt-2 text-sm text-stone-500">Registrate para comprar en BuenMate</p>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-5">

      <div>
        <label for="nombre" class="mb-1.5 block text-sm font-medium text-stone-600">Nombre</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Tu nombre"
          class="w-full rounded-xl border border-[#eae3d9] bg-[#faf8f4] px-4 py-3 text-stone-800 placeholder-stone-400 outline-none transition focus:border-[#c1502e] focus:ring-2 focus:ring-[#c1502e]/20"
        />
      </div>

      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-stone-600">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          class="w-full rounded-xl border border-[#eae3d9] bg-[#faf8f4] px-4 py-3 text-stone-800 placeholder-stone-400 outline-none transition focus:border-[#c1502e] focus:ring-2 focus:ring-[#c1502e]/20"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-stone-600">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full rounded-xl border border-[#eae3d9] bg-[#faf8f4] px-4 py-3 text-stone-800 placeholder-stone-400 outline-none transition focus:border-[#c1502e] focus:ring-2 focus:ring-[#c1502e]/20"
        />
      </div>

      @if(errorMessage) {
        <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-600">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="registroForm.invalid"
        class="w-full rounded-xl bg-[#c1502e] py-3 font-semibold text-white transition hover:bg-[#a8451f] disabled:cursor-not-allowed disabled:opacity-50">
        Registrarse
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-stone-500">
      ¿Ya tenés cuenta?
      <a routerLink="/login" class="font-semibold text-[#c1502e] hover:underline">Iniciá sesión</a>
    </p>

  </div>
</section>
