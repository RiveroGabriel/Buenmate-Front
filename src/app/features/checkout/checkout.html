<section class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">

  <h2 class="text-3xl font-black text-stone-800">Tu carrito</h2>

  @if(items.length === 0) {
    <div class="mt-8 rounded-2xl border border-[#eae3d9] bg-white p-10 text-center">
      <p class="text-stone-500">No tenés productos en el carrito.</p>
      <a routerLink="/" class="mt-4 inline-block rounded-xl bg-[#c1502e] px-6 py-3 font-semibold text-white transition hover:bg-[#a8451f]">
        Ver productos
      </a>
    </div>
  }

  @if(items.length > 0) {
    <div class="mt-6 space-y-4">
      @for(item of items; track item.productoId) {
        <div class="flex items-center justify-between rounded-2xl border border-[#eae3d9] bg-white p-4">
          <div>
            <h3 class="font-bold text-stone-800">{{ item.nombre }}</h3>
            <p class="text-sm text-stone-500">Cantidad: {{ item.cantidad }}</p>
          </div>
          <p class="font-bold text-stone-800">${{ item.precio * item.cantidad }}</p>
        </div>
      }
    </div>

    <div class="mt-6 flex items-center justify-between rounded-2xl border border-[#eae3d9] bg-white p-5">
      <span class="text-lg font-bold text-stone-800">Total</span>
      <span class="text-2xl font-black text-[#c1502e]">${{ total }}</span>
    </div>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row">
      <button (click)="vaciarCarrito()" class="rounded-xl border border-[#eae3d9] bg-white px-6 py-3 font-medium text-stone-700 transition hover:bg-[#f2ede6]">
        Vaciar carrito
      </button>
      <button (click)="crearPedido()" class="flex-1 rounded-xl bg-[#c1502e] px-6 py-3 font-semibold text-white transition hover:bg-[#a8451f]">
        Crear pedido
      </button>
    </div>
  }

</section>
